name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, sodium, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHPCS
        run: vendor/bin/phpcs

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: association
          POSTGRES_PASSWORD: association
          POSTGRES_DB: association_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U association"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://association:association@127.0.0.1:5432/association_test?serverVersion=18&charset=utf8
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, sodium, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Create test database
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Load fixtures
        run: php bin/console doctrine:fixtures:load --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit
